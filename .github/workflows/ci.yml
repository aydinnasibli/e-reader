# Checks every push and pull request, and proves the app still builds for
# release on both platforms. Publishes nothing: releases come only from
# android-apk.yml on main.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Unit, screen and flow tests
        run: npm test
      - name: Production JS bundles (Hermes)
        run: npx expo export --platform android --platform ios --output-dir dist

  android-release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The sideloaded APK (self-updating) and a Play Store bundle.
        flavor: [sideload, store]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Generate the native Android project
        env:
          STORE_BUILD: ${{ matrix.flavor == 'store' && '1' || '' }}
        run: |
          npx expo prebuild --platform android --no-install --clean
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
      - name: Install Android NDK
        env:
          NDK_VERSION: 27.1.12297006
        run: |
          [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ] && exit 0
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null && exit 0
            sleep 15
          done
          exit 1
      - name: Build release
        working-directory: android
        env:
          STORE_BUILD: ${{ matrix.flavor == 'store' && '1' || '' }}
        run: ./gradlew ${{ matrix.flavor == 'store' && 'bundleRelease' || 'assembleRelease' }} --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Merged manifest checks (target SDK; no self-install permission in store builds)
        run: |
          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*release*' | grep -i merged | head -1)
          echo "$MERGED"
          grep -o 'android:targetSdkVersion="[0-9]*"' "$MERGED"
          grep -q 'android:targetSdkVersion="3[6-9]"' "$MERGED"
          if [ "${{ matrix.flavor }}" = store ]; then ! grep -q 'REQUEST_INSTALL_PACKAGES' "$MERGED"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

  ios-release:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Build release (simulator, unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 80
      - name: Privacy manifest is in the app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphonesimulator/*.app' -maxdepth 6 -type d | head -1)
          echo "$APP"
          plutil -p "$APP/PrivacyInfo.xcprivacy"
