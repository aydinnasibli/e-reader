# Builds a signed Android APK on every push to main and publishes it as a
# GitHub release. The app checks the latest release and offers to update.
# No Expo account or secrets needed: GitHub provides the release token.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate the native Android project
        run: |
          npx expo prebuild --platform android --no-install --clean
          # More memory for Gradle. Edit the existing line: the generated file
          # has no trailing newline, so appending would corrupt its last entry.
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          grep -q '^org.gradle.jvmargs=-Xmx4g' android/gradle.properties

      # Gradle would download the NDK itself, with no retry if the download is
      # damaged. Install it up front instead (the version React Native needs).
      - name: Install Android NDK
        env:
          NDK_VERSION: 27.1.12297006
        run: |
          [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ] && exit 0
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null && exit 0
            echo "NDK download failed (attempt $i), retrying"
            sleep 15
          done
          exit 1

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          # Gradle hides the output of node commands it runs while configuring;
          # put a wrapper first on PATH that records any node command that fails.
          WRAP="$RUNNER_TEMP/nodewrap"
          mkdir -p "$WRAP"
          cat > "$WRAP/node" <<EOF
          #!/usr/bin/env bash
          err=\$(mktemp)
          "$(command -v node)" "\$@" 2>"\$err"
          rc=\$?
          cat "\$err" >&2
          if [ \$rc -ne 0 ]; then
            { echo "--- node exited \$rc in \$PWD:"; printf ' %q' "\$@"; echo; cat "\$err"; } >> "$RUNNER_TEMP/node-failures.log"
          fi
          rm -f "\$err"
          exit \$rc
          EOF
          chmod +x "$WRAP/node"
          export PATH="$WRAP:$PATH"
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee ../gradle.log || {
            # Gradle interleaves output from parallel tasks; repeat the errors at the end of the log.
            echo "===== build errors ====="
            grep -n -E -B3 -A30 "FAILED|What went wrong|Error:|error:|ERROR|Exception" ../gradle.log | grep -v -E "^[0-9]+-w: " | tail -250
            echo "===== failed node commands ====="
            cat "$RUNNER_TEMP/node-failures.log" 2>/dev/null | tail -150
            exit 1
          }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nec-reader.apk
          gh release create "build-$BUILD_NUMBER" nec-reader.apk \
            --title "Nec e-book reader 1.0.$BUILD_NUMBER" \
            --notes "${NOTES:-Manual build}" \
            --latest
          # Keep the 5 newest builds; older ones are never offered again.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
